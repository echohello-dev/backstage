apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mcp-server
  title: MCP Server
  tags:
    - recommended
    - family:ai-native
    - provider:github
    - ai
    - mcp
  description: |
    Scaffold a Model Context Protocol (MCP) server: a stdio-based tool
    server that AI assistants connect to for domain-specific tools and
    context. Ships with one example tool, an AGENTS.md, a TechDocs site,
    and catalog registration.
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Server details
      required:
        - owner
        - name
      properties:
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        name:
          title: Name
          type: string
          description: Unique name of the MCP server
          ui:placeholder: my-mcp-server
        description:
          title: Description
          type: string
          description: What tools and context this server exposes

    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
            allowedHosts:
              - github.com
            allowedOwners:
              - echohello-dev
            allowedOrganizations:
              - echohello-dev

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./template
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        visibility: public

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Next steps
        content: |
          Your MCP server skeleton is ready. Add tools in `src/index.ts`
          with `server.registerTool(...)` and document them in `docs/`.
