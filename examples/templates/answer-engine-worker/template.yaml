apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: answer-engine-worker
  title: Answer Engine Worker
  tags:
    - recommended
    - family:ai-native
    - provider:github
    - ai
    - rag
  description: |
    Scaffold an answer-engine worker: a queue consumer that picks up
    questions, retrieves context from a document index, and produces cited
    answers. Ships with an indexer, a query API, an AGENTS.md, a TechDocs
    site, and catalog registration.
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Worker details
      required:
        - owner
        - name
      properties:
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        name:
          title: Name
          type: string
          description: Unique name of the worker
          ui:placeholder: answer-engine
        description:
          title: Description
          type: string
          description: What this answer engine covers (sources, audience)

    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
            allowedHosts:
              - github.com
            allowedOwners:
              - echohello-dev
            allowedOrganizations:
              - echohello-dev

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./template
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        visibility: public

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Next steps
        content: |
          Your answer-engine skeleton is ready. Connect a queue in
          `src/consumer.ts`, a document source in `src/indexer.ts`, and an
          AI Hub endpoint in `src/api.ts`.
