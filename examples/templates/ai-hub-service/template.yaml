apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ai-hub-service
  title: AI Hub Service
  tags:
    - recommended
    - family:ai-native
    - provider:github
    - ai
    - llm
  description: |
    Scaffold an AI Hub service: a thin, provider-agnostic gateway in front of
    your organisation's LLM providers. Centralises authentication, rate
    limiting, cost tracking, and audit logging for inference traffic.
    Ships with an AGENTS.md, a TechDocs site, and catalog registration.
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Service details
      required:
        - owner
        - name
      properties:
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        name:
          title: Name
          type: string
          description: Unique name of the service
          ui:placeholder: ai-hub
        description:
          title: Description
          type: string
          description: What this AI Hub fronts (providers, teams, use cases)

    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
            allowedHosts:
              - github.com
            allowedOwners:
              - echohello-dev
            allowedOrganizations:
              - echohello-dev

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./template
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}
        visibility: public

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Next steps
        content: |
          Your AI Hub skeleton is ready. Wire a provider in `src/providers/`,
          then update `AGENTS.md` with the conventions your team settles on.
